[project]
name = "kinograf"
version = "0.1.0"
description = "Довідник українських фільмів на основі відкритих даних Wikidata"
requires-python = ">=3.12"
dependencies = [
    "SPARQLWrapper>=2.0",
    "fastapi>=0.115",
    "pyshacl>=0.30",
    "rdflib>=7.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kinograf*"]

[tool.setuptools.package-data]
"kinograf.rdf" = ["shapes.ttl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D"]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D101", "D102", "D103"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=kinograf --cov-report=term-missing"
filterwarnings = [
    "ignore:ConjunctiveGraph is deprecated:DeprecationWarning:rdflib.plugins.parsers.jsonld",
]

[tool.coverage.run]
omit = ["kinograf/opendata/__main__.py"]
