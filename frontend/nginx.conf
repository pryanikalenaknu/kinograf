limit_req_zone $binary_remote_addr zone=sparql:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=admin:10m rate=60r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 64k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~ ^/api/(sparql|export/sparql)$ {
        limit_req zone=sparql burst=10 nodelay;
        include /etc/nginx/kinograf/api.conf;
    }

    location /api/admin/ {
        limit_req zone=admin burst=20 nodelay;
        include /etc/nginx/kinograf/api.conf;
    }

    location /api/ {
        include /etc/nginx/kinograf/api.conf;
    }

    location /assets/ {
        include /etc/nginx/kinograf/security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/kinograf/security.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        include /etc/nginx/kinograf/security.conf;
        try_files $uri /index.html;
    }
}
