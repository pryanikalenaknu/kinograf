name: Перевірка коду

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Встановлення залежностей
        run: pip install -e ".[dev]"
      - name: Перевірка стилю
        run: |
          ruff check .
          ruff format --check .
      - name: Тести з вимірюванням покриття
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Встановлення залежностей
        run: npm ci
      - name: Перевірка стилю
        run: npm run lint
      - name: Тести з вимірюванням покриття
        run: npm run coverage
      - name: Збірка
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Встановлення сервера
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -e .
      - name: Встановлення інтерфейсу
        working-directory: frontend
        run: npm ci
      - name: Встановлення Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Приймальні тести
        working-directory: e2e
        run: npm test
